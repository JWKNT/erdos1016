name: Verify Lean proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fresh kernel verification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain and dependency cache
        run: |
          mkdir -p .verification
          bash scripts/install_ci_toolchain.sh 2>&1 | tee .verification/bootstrap.log

      - name: Test verification tools
        id: tools
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee .verification/tool-tests.log

      - name: Rebuild and verify the theorem
        id: verify
        run: |
          python3 scripts/verify.py --fresh --jobs 2

      - name: Summarize verification
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          outcome = os.environ.get('VERIFY_OUTCOME', '') or 'not run'
          report = Path('.verification/verification.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Lean verification\n\n')
              if outcome == 'success':
                  summary.write('Fresh verification passed.\n\n')
              else:
                  summary.write(f'Verification did not pass (verifier step: {outcome}).\n\n')
              if report.exists():
                  summary.write('Verification report:\n\n```json\n')
                  summary.write(report.read_text())
                  summary.write('\n```\n')
              else:
                  summary.write('No verification report was produced. Check the setup and tool-test logs.\n')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
