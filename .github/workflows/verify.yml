name: Verify Lean theorem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fresh kernel and statement checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test verification gates
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install pinned Lean and dependency artifacts
        run: bash scripts/install_ci_toolchain.sh

      - name: Rebuild and verify the unconditional theorem
        id: theorem
        run: python3 scripts/verify.py --fresh --jobs 2

      - name: Record verification outcome
        if: always()
        env:
          THEOREM_OUTCOME: ${{ steps.theorem.outcome }}
        run: |
          if [[ "$THEOREM_OUTCOME" == success ]]; then
            printf '%s\n' 'The unconditional theorem passed the fresh kernel, statement, and axiom checks. The hash-bound report is in the verification artifact.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Verification did not complete successfully. This run does not certify the theorem; inspect its logs and any partial verification report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
