name: Publish the guided tours
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'paper/erdos1016.pdf'
      - 'paper/minimal/forest/forest.pdf'
      - 'paper/minimal/pancyclic/pancyclic.pdf'
      - 'paper/minimal/exact-maximum/exact-maximum.pdf'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy the current papers
        run: |
          cp paper/erdos1016.pdf site/paper.pdf
          mkdir -p site/papers
          cp paper/minimal/forest/forest.pdf site/papers/forest.pdf
          cp paper/minimal/pancyclic/pancyclic.pdf site/papers/pancyclic.pdf
          cp paper/minimal/exact-maximum/exact-maximum.pdf site/papers/exact-maximum.pdf
      - run: node --test site/tests/*.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
